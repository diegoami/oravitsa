name: Build desktop and Web

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import and check gameplay
        run: |
          mkdir -p build
          touch build/.gdignore
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s art -p 'test_*.py'
          python3 tools/verify.py
      - name: Export both platforms
        run: python3 tools/export.py all
      - name: Check native export starts
        run: |
          chmod +x build/linux/oravitsa.x86_64
          python3 tools/verify.py --native-smoke build/linux/oravitsa.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: oravitsa-web
          path: build/site/
      - uses: actions/upload-artifact@v4
        with:
          name: oravitsa-linux
          path: build/linux/
